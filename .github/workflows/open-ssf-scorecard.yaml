name: OpenSSF Scorecard
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  # For Branch-Protection check. Only the default branch is supported. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  # To guarantee Maintained check is occasionally updated. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  schedule:
    - cron: "50 4 * * 0"
  push:
    branches: ["main", "master"]
    paths:
      - "**"
# Declare default permissions as none.
permissions: {}
jobs:
  openssf-scorecard:
    name: "OpenSSF Scorecard"
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/openssf-scorecard.yaml@6ee08860f804e9801edc85ff610baf2cefd66b1e # v0.4.0
    permissions:
      contents: read # checkout
      security-events: write # upload results to the code scanning dashboard
      id-token: write # publish results and obtain the badge, via OIDC
      actions: read # upload-sarif reads run info on private repositories
      # Uncomment the permissions below if installing in a private
      # repository, or Scorecard loses the commit and SAST signals.
      # issues: read
      # pull-requests: read
      # checks: read
